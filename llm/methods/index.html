<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缓解方法 - 累了吗</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 10a40 40 0 1 0 40 40 40 40 0 0 1-25 8A40 40 0 0 1 50 10z' fill='%23c4956a'/></svg>" type="image/svg+xml">
    <style>
        :root {
            --bg: #16191e;
            --bg-card: #1f2329;
            --bg-card-alt: #262a32;
            --text: #e8e0d4;
            --text-muted: #b8b0a2;
            --text-dim: #8a8278;
            --accent: #c99a7a;
            --accent-light: #d4a88a;
            --border: rgba(255, 255, 255, 0.05);
            --border-light: rgba(255, 255, 255, 0.1);
            --radius: 16px;
            --radius-sm: 8px;
            --font-cn: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            --font-serif: "Noto Serif SC", "STSong", "Songti SC", serif;
            --font-en: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { 
            scroll-behavior: smooth; 
            -webkit-font-smoothing: antialiased; 
            overflow-x: hidden; 
            touch-action: pan-y;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-cn);
            line-height: 1.75;
            letter-spacing: 0.025em;
            overflow-x: hidden;
            min-height: 100vh;
            width: 100%;
            max-width: 100vw;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(201, 154, 122, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(150, 130, 110, 0.03) 0%, transparent 50%);
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        .page { 
            max-width: 680px; 
            margin: 0 auto; 
            padding: 60px 24px 80px; 
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-link {
            display: inline-block; 
            font-size: 12px; 
            color: var(--text-dim); 
            text-decoration: none;
            letter-spacing: 0.06em; 
            margin-bottom: 32px; 
            opacity: 0.6; 
            transition: all var(--transition-fast);
        }
        .back-link:hover { 
            opacity: 1; 
            color: var(--accent); 
        }

        .page-title {
            font-size: clamp(28px, 5vw, 36px); 
            font-weight: 300; 
            color: #f5ede0;
            margin-bottom: 8px; 
            letter-spacing: 0.04em;
        }

        .page-intro {
            font-size: 15px; 
            color: var(--text-muted); 
            margin-bottom: 40px;
            font-style: italic; 
            font-family: var(--font-serif);
            line-height: 1.8;
        }

        .list-card {
            background: var(--bg-card); 
            border-radius: var(--radius); 
            padding: 26px 24px;
            border: 1px solid var(--border); 
            transition: all var(--transition); 
            display: block;
            text-decoration: none; 
            color: inherit; 
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
        }

        .list-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--accent), transparent);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .list-card:hover {
            background: var(--bg-card-alt); 
            border-color: rgba(201,154,122,0.35);
            transform: translateY(-3px); 
            box-shadow: 0 12px 32px rgba(0,0,0,0.3);
        }

        .list-card:hover::before {
            opacity: 0.7;
        }

        .list-card-tag {
            font-size: 10px; 
            letter-spacing: 0.12em; 
            color: var(--text-dim); 
            text-transform: uppercase;
            font-family: var(--font-en); 
            margin-bottom: 8px;
            font-weight: 500;
        }

        .list-card-title { 
            font-size: 17px; 
            font-weight: 500; 
            color: #ebe3d8; 
            margin-bottom: 8px;
            letter-spacing: 0.03em;
        }

        .list-card-desc { 
            font-size: 14px; 
            color: var(--text-muted); 
            line-height: 1.6;
        }

        .footer-nav {
            margin-top: 56px; 
            display: flex; 
            justify-content: center;
        }

        .footer-nav a {
            font-size: 12px; 
            color: var(--text-dim); 
            text-decoration: none; 
            opacity: 0.5;
            transition: all var(--transition-fast); 
            letter-spacing: 0.06em;
            font-family: var(--font-en);
        }
        .footer-nav a:hover { 
            opacity: 1; 
            color: var(--accent); 
        }

        @media (max-width: 600px) {
            .page { padding: 40px 16px 60px; }
            .page-title { font-size: 24px; }
            .list-card { padding: 22px 20px; }
            .list-card-title { font-size: 16px; }
            .list-card-desc { font-size: 13px; }
        }

        ::selection { 
            background: rgba(201, 154, 122, 0.35); 
            color: #f8f0e4; 
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(201, 154, 122, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(201, 154, 122, 0.5);
        }
    </style>
</head>
<body>
    <div class="page">
        <a href="/" class="back-link">← 返回首页</a>

        <h1 class="page-title">缓解方法</h1>
        <p class="page-intro">从呼吸到睡眠，从工作到生活。</p>

        <a href="/methods/001.html" class="list-card">
            <div class="list-card-tag">呼吸</div>
            <div class="list-card-title">4-7-8 呼吸法：用呼吸切换状态</div>
            <div class="list-card-desc">一种被临床验证的呼吸节奏，能在几分钟内降低焦虑，帮助入睡。</div>
        </a>
        <a href="/methods/002.html" class="list-card">
            <div class="list-card-tag">放松</div>
            <div class="list-card-title">渐进式放松：从脚趾开始卸下全身紧张</div>
            <div class="list-card-desc">用“收紧 5 秒再松开”的系统方法，把身体里那些无意识收紧的部位一个一个松开。</div>
        </a>
        <a href="/methods/003.html" class="list-card">
            <div class="list-card-tag">护眼</div>
            <div class="list-card-title">20-20-20 法则：给眼睛一个微型假期</div>
            <div class="list-card-desc">每 20 分钟，看 20 英尺外，持续 20 秒——睫状肌最简单的恢复动作。</div>
        </a>

        <div class="footer-nav">
            <a href="/">回到首页</a>
        </div>
    </div>

    <script>
        (function() {
            let touchStartX = 0;
            let touchStartY = 0;

            function handleTouchStart(e) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }

            function handleTouchMove(e) {
                if (!touchStartX || !touchStartY) return;
                
                const touchCurrentX = e.touches[0].clientX;
                const touchCurrentY = e.touches[0].clientY;
                const diffX = touchCurrentX - touchStartX;
                const diffY = touchCurrentY - touchStartY;

                if (Math.abs(diffX) > Math.abs(diffY)) {
                    e.preventDefault();
                }

                touchStartX = touchCurrentX;
                touchStartY = touchCurrentY;
            }

            document.addEventListener('touchstart', handleTouchStart, { passive: true });
            document.addEventListener('touchmove', handleTouchMove, { passive: false });

            window.addEventListener('scroll', function() {
                if (window.scrollX !== 0) {
                    window.scrollTo(0, window.scrollY);
                }
            });
        })();
    </script>
</body>
</html>
