<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我是累了吗？</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>我是累了吗？</h1>
      <p class="subtitle">了解你的累，是照顾自己的第一步</p>
    </header>
    
    <div class="story-container" id="introContainer">
      <div class="story-text">
        了解你的累，是照顾自己的第一步。<br><br>
        下面有12组描述，每一组请选择 <strong>最近一周最贴近你状态</strong> 的那一项。<br><br>
        没有对错，凭第一感觉选就好。这只是一次温柔的自我觉察。
      </div>
      <button class="btn" id="startQuizBtn">开始测试</button>
    </div>
    
    <div class="question-container" id="questionContainer" style="display: none;">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      
      <div class="question-number" id="questionNumber">第 1 组 / 12</div>
      <div class="question-text" id="questionText">
        明明计划好要做事，却忍不住刷手机、发呆，事后又懊恼。
      </div>
      
      <div class="options" id="options">
        <button class="option" data-score="self">
          A. 明明计划好要做事，却忍不住刷手机、发呆，事后又懊恼。
        </button>
        <button class="option" data-score="physical">
          B. 身体像灌了铅，脑子想动但身体真的不想动。
        </button>
      </div>
    </div>
    
    <div class="result-container" id="resultContainer" style="display: none;">
      <div class="result-icon" id="resultIcon">😊</div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-description" id="resultDescription"></div>
      
      <div class="buttons-container">
        <a href="stories.html" class="btn">
          看看为什么累了要重视？
        </a>
        <a href="solution.html" class="btn btn-secondary">
          我该怎么缓解？
        </a>
      </div>
      
      <p style="margin-top: 20px; font-size: 0.95rem; color: var(--text-color); opacity: 0.7; font-style: italic;">
        你看，你的累有名字了。这已经是很重要的一步。
      </p>
    </div>
    
    <footer>
      <a href="index.html" style="color: var(--text-color); opacity: 0.6; text-decoration: none;">返回首页</a>
    </footer>
  </div>

  <script>
    const questions = [
      {
        optionA: 'A. 明明计划好要做事，却忍不住刷手机、发呆，事后又懊恼。',
        optionB: 'B. 身体像灌了铅，脑子想动但身体真的不想动。'
      },
      {
        optionA: 'A. 一想到任务清单，就觉得心累、想逃避。',
        optionB: 'B. 睡了一整晚，早上起来还是浑身乏力。'
      },
      {
        optionA: 'A. 如果突然多出2小时空闲，我会焦躁不知道该做什么，或继续磨蹭。',
        optionB: 'B. 如果突然多出2小时空闲，我只想躺着或干脆睡一觉。'
      },
      {
        optionA: 'A. 累是因为脑子里太多声音在打架，停不下来。',
        optionB: 'B. 累是因为感觉电量已经耗尽，连思考都费劲。'
      },
      {
        optionA: 'A. 最近容易对自己失望，怪自己不够自律。',
        optionB: 'B. 最近对外界兴趣减退，以前喜欢的事现在也提不起劲。'
      },
      {
        optionA: 'A. 我的累在工作/学习开始时最明显，开始动手后反而可能好一些。',
        optionB: 'B. 我的累在工作/学习结束后最明显，需要很长时间恢复。'
      },
      {
        optionA: 'A. 坐着不动的时候，心里也七上八下，并不是真正放松。',
        optionB: 'B. 坐着不动的时候，身体终于能喘口气，但疲劳感一阵阵涌上来。'
      },
      {
        optionA: 'A. 即使休息时，脑子里也会反复想「还有事没做」。',
        optionB: 'B. 休息时只想放空，身体沉重，连想事的力气都没有。'
      },
      {
        optionA: 'A. 拖得越久越自责，越自责越不想动，像进了一个循环。',
        optionB: 'B. 做什么都觉得费力，连简单的决定都能耗尽力气。'
      },
      {
        optionA: 'A. 别人觉得我懒，其实我只是心里在打架。',
        optionB: 'B. 别人觉得我懒，其实我只是身体被掏空了。'
      },
      {
        optionA: 'A. 如果能回到精力充沛的一天，我会先把拖延的那件事干掉。',
        optionB: 'B. 如果能回到精力充沛的一天，我会好好睡一觉，什么也不做。'
      },
      {
        optionA: 'A. 我的累更多和「管不住自己」有关。',
        optionB: 'B. 我的累更多和「真的需要休息」有关。'
      }
    ];

    let currentQuestion = 0;
    let scores = { self: 0, physical: 0 };
    
    const introContainer = document.getElementById('introContainer');
    const questionContainer = document.getElementById('questionContainer');
    const resultContainer = document.getElementById('resultContainer');
    const questionNumber = document.getElementById('questionNumber');
    const options = document.getElementById('options');
    const progressFill = document.getElementById('progressFill');
    const startQuizBtn = document.getElementById('startQuizBtn');
    
    const resultIcon = document.getElementById('resultIcon');
    const resultTitle = document.getElementById('resultTitle');
    const resultDescription = document.getElementById('resultDescription');

    function loadQuestion(index) {
      const question = questions[index];
      questionNumber.textContent = `第 ${index + 1} 组 / ${questions.length}`;
      
      options.innerHTML = '';
      
      const optionA = document.createElement('button');
      optionA.className = 'option';
      optionA.textContent = question.optionA;
      optionA.addEventListener('click', () => selectOption('self'));
      options.appendChild(optionA);
      
      const optionB = document.createElement('button');
      optionB.className = 'option';
      optionB.textContent = question.optionB;
      optionB.addEventListener('click', () => selectOption('physical'));
      options.appendChild(optionB);
      
      progressFill.style.width = `${((index + 1) / questions.length) * 100}%`;
    }

    function selectOption(score) {
      scores[score]++;
      currentQuestion++;
      
      if (currentQuestion >= questions.length) {
        showResult();
      } else {
        loadQuestion(currentQuestion);
      }
    }

    function showResult() {
      questionContainer.style.display = 'none';
      resultContainer.style.display = 'block';
      
      let fatigueType;
      let icon;
      let title;
      let description;
      
      const sScore = scores.self;
      const pScore = scores.physical;
      const diff = sScore - pScore;
      
      if (sScore >= 8 && diff >= 3) {
        fatigueType = 'self-inflicted';
        icon = '🧠';
        title = '「心里在打架」型';
        description = '你的累，更多来自内心的拉扯。拖延、自责、自制力消耗，像后台程序一样偷偷吃掉你的精力。你不是没有能量，而是能量被内耗了。这种累最隐蔽，因为它常常披着「我不够好」的外衣。<br><br><strong>学者悄悄话：</strong>自我攻击是最大的能量漏洞，先停止自责，就是帮自己充电。';
      } else if (pScore >= 8 && diff <= -3) {
        fatigueType = 'physical';
        icon = '💤';
        title = '「身体在求救」型';
        description = '你的身体正在诚实地发出休息请求。肌肉、神经、免疫系统可能已经过度负载。这不是意志力能解决的，你需要真正的生理恢复：睡眠、营养、放空。忽略它，身体会以更激烈的方式让你停下来。<br><br><strong>学者悄悄话：</strong>把休息看作一种技能，像吃饭一样是刚需，不是奖励。';
      } else {
        fatigueType = 'mixed';
        icon = '🤝';
        title = '「身心交织」型';
        description = '你同时承受着心理内耗和生理透支，而且它们互相加重。身体累让你更不想行动，进而产生更多自责；而心理压力又让身体无法真正放松。打破这个循环需要先找一个微小切口——哪怕只是今晚提前半小时关灯。<br><br><strong>学者悄悄话：</strong>先关怀身体，再梳理内心，顺序对了，结就容易解。';
      }
      
      resultIcon.textContent = icon;
      resultTitle.textContent = title;
      resultDescription.innerHTML = description;
      
      localStorage.setItem('fatigueType', fatigueType);
      localStorage.setItem('sScore', sScore.toString());
      localStorage.setItem('pScore', pScore.toString());
    }

    startQuizBtn.addEventListener('click', () => {
      introContainer.style.display = 'none';
      questionContainer.style.display = 'flex';
      loadQuestion(0);
    });
  </script>
</body>
</html>
