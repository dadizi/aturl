<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7BAE9A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Cache-Control" content="public, max-age=604800">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>我是哪种累？</title>
  <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>
  <div class="loader" id="loader">
    <div class="loader-content">
      <span class="loader-icon">🌿</span>
      <span class="loader-text">正在加载...</span>
    </div>
  </div>
  
  <div class="container" id="mainContent" style="display: none;">
    <header>
      <h1>我是哪种累？</h1>
      <p class="subtitle">花几分钟，好好看看自己</p>
    </header>
    
    <div class="story-container" id="introContainer">
      <div class="story-text">
        嗨～不用紧张，这只是一次小小的自我对话。<br><br>
        下面有12个小问题，每一题都选 <strong>最近一周最像你的那一个</strong> 就好。<br><br>
        没有对错，跟着直觉走。我们只是想更懂你一点。
      </div>
      <button class="btn" id="startQuizBtn">开始聊聊</button>
    </div>
    
    <div class="question-container" id="questionContainer" style="display: none;">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      
      <div class="question-number" id="questionNumber">第 1 题 / 12</div>
      <div class="question-text" id="questionText">
        明明想做事，却忍不住刷手机？
      </div>
      
      <div class="options" id="options">
        <button class="option" data-score="self">
          A. 对，刷完又后悔，总觉得时间悄悄溜走了
        </button>
        <button class="option" data-score="physical">
          B. 不是不想动，是身体真的沉得像灌了铅
        </button>
      </div>
    </div>
    
    <div class="result-container" id="resultContainer" style="display: none;">
      <div class="result-icon" id="resultIcon">😊</div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-description" id="resultDescription"></div>
      
      <div class="buttons-container">
        <a href="stories.html" class="btn" onclick="handleLinkClick(this)">
          听听类似的故事
        </a>
        <a href="solution.html" class="btn btn-secondary" onclick="handleLinkClick(this)">
          试试轻松一点的方法
        </a>
      </div>
      
      <p style="margin-top: 20px; font-size: 0.95rem; color: var(--text-color); opacity: 0.7; font-style: italic;">
        找到你的「累」了，这就是改变的开始呀～
      </p>
    </div>
    
    <footer>
      <a href="index.html" style="color: var(--text-color); opacity: 0.6; text-decoration: none;" onclick="handleLinkClick(this)">回首页歇会儿</a>
    </footer>
  </div>

  <div class="error-overlay" id="errorOverlay" style="display: none;">
    <div class="error-content">
      <span class="error-icon">😔</span>
      <p class="error-text">网络有点慢，再试一次吧</p>
      <button class="btn" onclick="reloadPage()">重新加载</button>
    </div>
  </div>

  <style>
    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #FFF9F5 0%, #F0F7F4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    
    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    
    .loader-icon {
      font-size: 2.5rem;
      animation: bounce 1s ease-in-out infinite;
    }
    
    .loader-text {
      font-size: 1rem;
      color: var(--text-light);
    }
    
    .error-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 249, 245, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      padding: 20px;
    }
    
    .error-content {
      text-align: center;
      max-width: 320px;
    }
    
    .error-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }
    
    .error-text {
      font-size: 1.1rem;
      color: var(--text-light);
      margin-bottom: 24px;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>

  <script>
    const questions = [
      { optionA: 'A. 对，刷完又后悔，总觉得时间悄悄溜走了', optionB: 'B. 不是不想动，是身体真的沉得像灌了铅' },
      { optionA: 'A. 一想到要做事就心累，总想躲一躲', optionB: 'B. 睡了一整晚，醒来还是觉得好累好累' },
      { optionA: 'A. 突然有空反而焦虑，不知道该干嘛', optionB: 'B. 有空闲时间只想躺着，能睡就睡' },
      { optionA: 'A. 脑子里像有好多小人在吵架，停不下来', optionB: 'B. 感觉电量耗尽，连想事情都觉得费劲' },
      { optionA: 'A. 总对自己失望，怪自己不够努力', optionB: 'B. 对什么都没兴趣，以前喜欢的也不想做' },
      { optionA: 'A. 刚开始做事时最累，做起来反而好点', optionB: 'B. 做完事最累，需要好久才能缓过来' },
      { optionA: 'A. 坐着不动也不踏实，心里七上八下', optionB: 'B. 坐着才能喘气，但累还是一阵阵涌上来' },
      { optionA: 'A. 休息时也老想着「还有事没做」', optionB: 'B. 休息时只想放空，连想事的力气都没有' },
      { optionA: 'A. 越拖越自责，越自责越不想动，像死循环', optionB: 'B. 做什么都觉得费力，连小决定都耗力气' },
      { optionA: 'A. 别人觉得我懒，其实我心里在打架', optionB: 'B. 别人觉得我懒，其实我真的被掏空了' },
      { optionA: 'A. 如果精力充沛，我要先把拖延的事做完', optionB: 'B. 如果精力充沛，我只想好好睡一觉' },
      { optionA: 'A. 我的累更多是「管不住自己」', optionB: 'B. 我的累更多是「真的需要休息」' }
    ];

    let currentQuestion = 0;
    let scores = { self: 0, physical: 0 };
    
    function handleLinkClick(element) {
      event.preventDefault();
      const url = element.getAttribute('href');
      document.getElementById('loader').style.display = 'flex';
      setTimeout(() => { window.location.href = url; }, 100);
    }

    function reloadPage() {
      document.getElementById('errorOverlay').style.display = 'none';
      document.getElementById('loader').style.display = 'flex';
      window.location.reload();
    }

    function loadQuestion(index) {
      const question = questions[index];
      document.getElementById('questionNumber').textContent = `第 ${index + 1} 题 / ${questions.length}`;
      
      const options = document.getElementById('options');
      options.innerHTML = '';
      
      const optionA = document.createElement('button');
      optionA.className = 'option';
      optionA.textContent = question.optionA;
      optionA.addEventListener('click', () => selectOption('self'));
      options.appendChild(optionA);
      
      const optionB = document.createElement('button');
      optionB.className = 'option';
      optionB.textContent = question.optionB;
      optionB.addEventListener('click', () => selectOption('physical'));
      options.appendChild(optionB);
      
      document.getElementById('progressFill').style.width = `${((index + 1) / questions.length) * 100}%`;
    }

    function selectOption(score) {
      scores[score]++;
      currentQuestion++;
      
      if (currentQuestion >= questions.length) {
        showResult();
      } else {
        loadQuestion(currentQuestion);
      }
    }

    function showResult() {
      document.getElementById('questionContainer').style.display = 'none';
      document.getElementById('resultContainer').style.display = 'block';
      
      const sScore = scores.self;
      const pScore = scores.physical;
      const diff = sScore - pScore;
      
      let fatigueType, icon, title, description;
      
      if (sScore >= 8 && diff >= 3) {
        fatigueType = 'self-inflicted';
        icon = '🌙';
        title = '「心里在打小架」的你';
        description = '你的累，像心里住着两个小人在拔河——一个想动，一个想逃。拖延、自责像后台耗电一样，悄悄吃掉你的能量。你不是懒，只是被自己的期待困住啦。<br><br><strong>悄悄话：</strong>先别骂自己啦，停下来抱抱那个「不想动」的自己吧。';
      } else if (pScore >= 8 && diff <= -3) {
        fatigueType = 'physical';
        icon = '🛋️';
        title = '「身体在喊充电」的你';
        description = '你的身体正在拼命给你发信号："我累啦！"肌肉、神经、睡眠都在抗议。这不是意志力的问题，是身体真的需要休息了。就像手机没电要充电，你也需要停下来啦。<br><br><strong>悄悄话：</strong>休息不是偷懒，是爱自己的必修课哦。';
      } else {
        fatigueType = 'mixed';
        icon = '🧩';
        title = '「身心都在喊累」的你';
        description = '你的心里和身体都在疲惫——身体累让你更不想动，心里纠结又让身体更累。别着急，我们可以一起慢慢解开这个结。先让身体舒服一点，心也会跟着轻松起来的。<br><br><strong>悄悄话：</strong>慢慢来，照顾好自己没有标准答案。';
      }
      
      document.getElementById('resultIcon').textContent = icon;
      document.getElementById('resultTitle').textContent = title;
      document.getElementById('resultDescription').innerHTML = description;
      
      try {
        localStorage.setItem('fatigueType', fatigueType);
        localStorage.setItem('sScore', sScore.toString());
        localStorage.setItem('pScore', pScore.toString());
      } catch(e) {
        console.log('localStorage unavailable');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('loader').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loader').style.display = 'none';
          document.getElementById('mainContent').style.display = 'flex';
        }, 300);
      }, 300);
      
      document.getElementById('startQuizBtn').addEventListener('click', () => {
        document.getElementById('introContainer').style.display = 'none';
        document.getElementById('questionContainer').style.display = 'flex';
        loadQuestion(0);
      });
    });

    window.addEventListener('load', () => {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('mainContent').style.display = 'flex';
    });

    window.addEventListener('error', () => {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('errorOverlay').style.display = 'flex';
    });

    window.addEventListener('offline', () => {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('errorOverlay').style.display = 'flex';
    });
  </script>
</body>
</html>
