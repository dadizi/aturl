<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7BAE9A">
  <meta http-equiv="Cache-Control" content="public, max-age=604800">
  <title>我是哪种累？</title>
  <style>
    :root{--primary:#7BAE9A;--secondary:#E8F4F0;--warm:#FDF8F3;--text:#5A5A5A;--light:#999;--radius:16px;--shadow:0 4px 16px rgba(0,0,0,0.08)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#FFF9F5,#F0F7F4);min-height:100vh;color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
    .container{max-width:520px;margin:0 auto;padding:40px 20px;min-height:100vh;display:flex;flex-direction:column}
    header{text-align:center;margin-bottom:32px}
    h1{font-size:2rem;background:linear-gradient(135deg,var(--primary),#5A8A7A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
    .subtitle{color:var(--light);font-size:1rem}
    .story-container,.question-container,.result-container{background:white;border-radius:var(--radius);padding:24px;margin-bottom:24px;box-shadow:var(--shadow)}
    .story-text{font-size:1rem;line-height:1.8;margin-bottom:20px}
    .story-text strong{color:var(--primary)}
    .btn{display:block;text-align:center;padding:14px 24px;background:var(--primary);color:white;border:none;border-radius:var(--radius);font-weight:600;font-size:1rem;cursor:pointer;transition:all 0.2s;text-decoration:none}
    .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.12)}
    .btn-secondary{background:var(--secondary);color:var(--primary)}
    .progress-bar{height:6px;background:var(--secondary);border-radius:3px;margin-bottom:20px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#5A8A7A);transition:width 0.3s ease;border-radius:3px}
    .question-number{font-size:0.9rem;color:var(--light);margin-bottom:8px}
    .question-text{font-size:1.1rem;font-weight:600;margin-bottom:20px;line-height:1.6}
    .options{display:flex;flex-direction:column;gap:12px}
    .option{padding:16px;background:var(--warm);border:2px solid transparent;border-radius:12px;text-align:left;font-size:0.95rem;cursor:pointer;transition:all 0.2s}
    .option:hover{border-color:var(--primary);transform:translateX(4px)}
    .option.selected{background:var(--secondary);border-color:var(--primary)}
    .result-icon{font-size:4rem;text-align:center;margin-bottom:16px}
    .result-title{font-size:1.3rem;font-weight:700;text-align:center;margin-bottom:16px;color:var(--primary)}
    .result-description{font-size:0.95rem;line-height:1.8;margin-bottom:24px}
    .buttons-container{display:flex;flex-direction:column;gap:12px;margin-top:20px}
    footer{text-align:center;margin-top:auto;padding-top:24px}
    footer a{color:var(--light);text-decoration:none;font-size:0.9rem}
    footer a:hover{color:var(--primary)}
    @media(max-width:480px){.container{padding:24px 16px}h1{font-size:1.8rem}.story-container,.question-container,.result-container{padding:20px}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>我是哪种累？</h1>
      <p class="subtitle">花几分钟，好好看看自己</p>
    </header>
    
    <div class="story-container" id="introContainer">
      <div class="story-text">
        嗨～不用紧张，这只是一次小小的自我对话。<br><br>
        下面有12个小问题，每一题都选 <strong>最近一周最像你的那一个</strong> 就好。<br><br>
        没有对错，跟着直觉走。我们只是想更懂你一点。
      </div>
      <button class="btn" id="startBtn">开始聊聊</button>
    </div>
    
    <div class="question-container" id="questionContainer" style="display:none;">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="question-number" id="questionNumber">第 1 题 / 12</div>
      <div class="question-text" id="questionText"></div>
      <div class="options" id="options"></div>
    </div>
    
    <div class="result-container" id="resultContainer" style="display:none;">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-description" id="resultDescription"></div>
      <div class="buttons-container">
        <a href="stories.html" class="btn">听听类似的故事</a>
        <a href="solution.html" class="btn btn-secondary">试试轻松一点的方法</a>
      </div>
      <p style="margin-top:20px;font-size:0.9rem;color:var(--light);text-align:center;font-style:italic">找到你的「累」了，这就是改变的开始呀～</p>
    </div>
    
    <footer><a href="index.html">回首页歇会儿</a></footer>
  </div>

  <script>
    const q=[
      ['A. 对，刷完又后悔，总觉得时间悄悄溜走了','B. 不是不想动，是身体真的沉得像灌了铅'],
      ['A. 一想到要做事就心累，总想躲一躲','B. 睡了一整晚，醒来还是觉得好累好累'],
      ['A. 突然有空反而焦虑，不知道该干嘛','B. 有空闲时间只想躺着，能睡就睡'],
      ['A. 脑子里像有好多小人在吵架，停不下来','B. 感觉电量耗尽，连想事情都觉得费劲'],
      ['A. 总对自己失望，怪自己不够努力','B. 对什么都没兴趣，以前喜欢的也不想做'],
      ['A. 刚开始做事时最累，做起来反而好点','B. 做完事最累，需要好久才能缓过来'],
      ['A. 坐着不动也不踏实，心里七上八下','B. 坐着才能喘气，但累还是一阵阵涌上来'],
      ['A. 休息时也老想着「还有事没做」','B. 休息时只想放空，连想事的力气都没有'],
      ['A. 越拖越自责，越自责越不想动，像死循环','B. 做什么都觉得费力，连小决定都耗力气'],
      ['A. 别人觉得我懒，其实我心里在打架','B. 别人觉得我懒，其实我真的被掏空了'],
      ['A. 如果精力充沛，我要先把拖延的事做完','B. 如果精力充沛，我只想好好睡一觉'],
      ['A. 我的累更多是「管不住自己」','B. 我的累更多是「真的需要休息」']
    ];
    let i=0,s={self:0,physical:0};
    
    function loadQ(){
      document.getElementById('questionNumber').textContent=`第 ${i+1} 题 / 12`;
      document.getElementById('progressFill').style.width=`${((i+1)/12)*100}%`;
      const opt=document.getElementById('options');
      opt.innerHTML=q[i].map((t,n)=>`<button class="option" onclick="sel(${n})">${t}</button>`).join('');
    }
    
    function sel(t){s[t===0?'self':'physical']++;i++<12?loadQ():show();}
    
    function show(){
      document.getElementById('questionContainer').style.display='none';
      document.getElementById('resultContainer').style.display='block';
      const ds=s.self,dp=s.physical,d=ds-dp;
      let ic,ti,de;
      if(ds>=8&&d>=3){ic='🌙';ti='「心里在打小架」的你';de='你的累，像心里住着两个小人在拔河——一个想动，一个想逃。拖延、自责像后台耗电一样，悄悄吃掉你的能量。你不是懒，只是被自己的期待困住啦。<br><br><strong>悄悄话：</strong>先别骂自己啦，停下来抱抱那个「不想动」的自己吧。';localStorage.setItem('fatigueType','self-inflicted');}
      else if(dp>=8&&d<=-3){ic='🛋️';ti='「身体在喊充电」的你';de='你的身体正在拼命给你发信号："我累啦！"肌肉、神经、睡眠都在抗议。这不是意志力的问题，是身体真的需要休息了。就像手机没电要充电，你也需要停下来啦。<br><br><strong>悄悄话：</strong>休息不是偷懒，是爱自己的必修课哦。';localStorage.setItem('fatigueType','physical');}
      else{ic='🧩';ti='「身心都在喊累」的你';de='你的心里和身体都在疲惫——身体累让你更不想动，心里纠结又让身体更累。别着急，我们可以一起慢慢解开这个结。先让身体舒服一点，心也会跟着轻松起来的。<br><br><strong>悄悄话：</strong>慢慢来，照顾好自己没有标准答案。';localStorage.setItem('fatigueType','mixed');}
      document.getElementById('resultIcon').textContent=ic;
      document.getElementById('resultTitle').textContent=ti;
      document.getElementById('resultDescription').innerHTML=de;
      localStorage.setItem('sScore',ds);localStorage.setItem('pScore',dp);
    }
    
    document.getElementById('startBtn').onclick=()=>{
      document.getElementById('introContainer').style.display='none';
      document.getElementById('questionContainer').style.display='block';
      loadQ();
    };
  </script>
</body>
</html>
