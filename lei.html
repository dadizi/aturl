  #scene{position:fixed;inset:0;z-index:1;touch-action:none}

  .hud-top{
    position:fixed;top:0;left:0;right:0;
    padding:5vh 5vw 0;text-align:center;
    z-index:10;pointer-events:none;
    transition:opacity .5s ease;
  }
  .hud-top.hide{opacity:0}
  .hud-label{
    font-size:clamp(11px,1.4vmin,13px);
    letter-spacing:.3em;padding-left:.3em;
    color:rgba(255,238,222,.35);font-weight:300;
  }
  .hud-num{
    display:block;margin:10px 0 12px;
    font-size:clamp(46px,12vmin,88px);
    font-weight:200;letter-spacing:.03em;
    color:rgba(255,236,218,.98);
    text-shadow:0 0 60px rgba(255,195,145,.45),
                0 0 120px rgba(255,170,120,.2);
    transition:transform .25s ease;
    line-height:1;
  }
  .hud-num.pop{transform:scale(1.06)}
  .hud-sub{
    display:block;
    font-size:clamp(12px,1.6vmin,14px);
    letter-spacing:.28em;padding-left:.28em;
    color:rgba(255,238,222,.45);font-weight:300;
  }

  .back-btn{
    position:fixed;top:4vh;left:4vw;
    z-index:20;
    background:rgba(20,14,10,.55);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,225,200,.18);
    border-radius:100px;
    padding:9px 20px;
    color:rgba(255,238,222,.75);
    font-size:13px;letter-spacing:.14em;padding-left:calc(20px + .14em);
    font-weight:300;cursor:pointer;
    opacity:0;
    transition:opacity .4s ease, border-color .3s ease, color .3s ease;
    pointer-events:none;
  }
  .back-btn.show{opacity:1;pointer-events:auto}
  .back-btn:hover{border-color:rgba(255,225,200,.35);color:rgba(255,238,222,.95)}

  .crumb{
    position:fixed;top:4vh;left:50%;transform:translateX(-50%);
    z-index:20;
    font-size:13px;letter-spacing:.28em;padding-left:.28em;
    color:rgba(255,232,210,.75);
    font-weight:300;
    opacity:0;pointer-events:none;
    transition:opacity .5s ease;
    text-shadow:0 0 30px rgba(255,190,140,.5);
  }
  .crumb.show{opacity:1}

  .hud-bottom{
    position:fixed;bottom:0;left:0;right:0;
    padding:0 5vw 4.5vh;text-align:center;
    z-index:10;
    pointer-events:none;
    transition:opacity .4s ease;
  }
  .hud-bottom.hide{opacity:0}
  .daily-line{
    font-size:clamp(11px,1.5vmin,13px);
    letter-spacing:.22em;padding-left:.22em;
    color:rgba(255,222,190,.5);font-weight:300;
    margin-bottom:8px;
    min-height:1.4em;
  }
  .hud-stats{
    font-size:clamp(10px,1.3vmin,12px);
    letter-spacing:.18em;padding-left:.18em;
    color:rgba(255,238,222,.24);font-weight:300;
    line-height:1.9;
    margin-bottom:10px;
  }
  .hud-stats .top-prov{color:rgba(255,215,175,.65)}

  .share-hint{
    font-size:11px;
    letter-spacing:.2em;padding-left:.2em;
    color:rgba(255,238,222,0);
    font-weight:300;
    margin-bottom:14px;
    min-height:1.2em;
    transition:color 2s ease;
  }
  .share-hint.show{color:rgba(255,238,222,.22)}

  .pc-hint{
    position:fixed;
    left:50%;bottom:calc(4.5vh + 130px);
    transform:translateX(-50%);
    z-index:11;
    font-size:12px;letter-spacing:.16em;padding-left:.16em;
    color:rgba(255,238,222,0);
    font-weight:300;white-space:nowrap;
    pointer-events:none;
    transition:color 2s ease;
  }
  .pc-hint.show{color:rgba(255,238,222,.28)}
  @media (max-width:900px){ .pc-hint{display:none} }

  .touch-hint{
    position:fixed;
    left:50%;bottom:calc(4.5vh + 130px);
    transform:translateX(-50%);
    z-index:11;
    font-size:12px;letter-spacing:.16em;padding-left:.16em;
    color:rgba(255,238,222,0);
    font-weight:300;white-space:nowrap;
    pointer-events:none;
    transition:color 2s ease;
  }
  .touch-hint.show{color:rgba(255,238,222,.28)}

  .btns{
    display:flex;justify-content:center;
  }
  .btn{
    padding:14px 38px;
    border:1px solid rgba(255,225,200,.18);
    border-radius:100px;
    background:rgba(20,14,10,.55);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    color:rgba(255,238,222,.75);
    font-size:clamp(13px,1.7vmin,15px);
    letter-spacing:.2em;padding-left:calc(38px + .2em);
    font-weight:300;cursor:pointer;
    transition:all .35s ease;
    pointer-events:auto;
  }
  .btn:hover{
    border-color:rgba(255,225,200,.35);
    color:rgba(255,238,222,.95);
    background:rgba(30,20,14,.75);
  }
  .btn:active{transform:scale(.97)}
  .btn.done{
    border-color:rgba(255,204,166,.45);
    color:rgba(255,212,172,.98);
    background:rgba(60,35,20,.65);
    cursor:default;

    position:fixed;left:0;right:0;bottom:0.8vh;

    letter-spacing:.1em;
    color:rgba(255,238,222,.09);
    line-height:1.6;z-index:10;pointer-events:none;
  }

  .panel{
    position:fixed;top:0;right:0;bottom:0;
    width:min(360px,86vw);
    background:linear-gradient(180deg, rgba(16,11,8,.92) 0%, rgba(10,7,5,.95) 100%);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border-left:1px solid rgba(255,200,150,.09);
    z-index:30;
    transform:translateX(100%);

    display:flex;flex-direction:column;
    padding:5vh 26px 4vh;
    pointer-events:auto;

    margin-bottom:6px;
  }
  .panel-title{

    color:rgba(255,235,215,.95);

  }

    margin-bottom:20px;font-weight:300;
    line-height:1.7;

    font-weight:400;
    color:rgba(255,232,210,.95);
  }
  .panel-list{

    display:flex;flex-direction:column;gap:14px;

    background:rgba(255,200,150,.08);

    }

  function pseudo(str){
    var h = 0;
    for (var i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) % 100000;
    return h / 100000;
  }
  function formatNum(n){
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function seedOf(str){
    var h = 0;
    for (var i=0;i<str.length;i++) h = (h*37 + str.charCodeAt(i)) % 100000;
    return h;
  }
  function valueOf(base, key){
    var t = Date.now() / 1000;
    var seed = seedOf(key);
    var wave = Math.sin(t/7 + seed) * base * 0.09;
    return Math.max(0, Math.floor(base + wave));
  }
  function cityBase(name){
    return 200 + (seedOf(name) % 1100);
  }
  function districtBase(name){
    return 40 + (seedOf(name) % 260);
  }
  function provincePeople(p){
    return valueOf(p.base * 8, p.name);
  }
  function cityPeople(c){
    return valueOf(cityBase(c.name) * 4, c.name);
  }

  var glowTexture = (function(){
    var c = document.createElement('canvas');
    c.width = c.height = 128;

    g.addColorStop(0.55,'rgba(255,160,110,0.12)');
    g.addColorStop(1,   'rgba(255,150,100,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  })();

  function createLabelNode(name){
    var dpr = 2;
    var W = 640;
    var H = 220;

    var canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext('2d');
    var texture = new THREE.CanvasTexture(canvas);
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;

    function draw(count){
      ctx.clearRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '300 ' + (34 * dpr) + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.shadowColor = 'rgba(255,180,130,0.6)';
      ctx.shadowBlur = 14 * dpr;
      ctx.fillStyle = 'rgba(255,240,225,0.88)';
      ctx.fillText(name, W/2, 66);

      ctx.font = '300 ' + (28 * dpr) + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.shadowColor = 'rgba(255,170,120,0.5)';
      ctx.shadowBlur = 10 * dpr;
      ctx.fillStyle = 'rgba(255,215,175,0.78)';
      ctx.fillText(formatNum(count), W/2, 148);

      texture.needsUpdate = true;
    }

    var mat = new THREE.SpriteMaterial({
      map: texture,
      transparent: true,
      opacity: 0.9,
      depthWrite: false,
      depthTest: false
    });
    var sprite = new THREE.Sprite(mat);
    sprite.scale.set(92, 31.6, 1);
    sprite.renderOrder = 10;

    return { sprite: sprite, draw: draw };
  }

  (function(){
    var positions = [];

      var nearest = [];

        if (i === j) return;
        var dx = a.px - b.px, dy = a.py - b.py, dz = a.pz - b.pz;
        nearest.push({ b:b, d: dx*dx + dy*dy + dz*dz });
      });
      nearest.sort(function(x,y){ return x.d - y.d; });
      nearest.slice(0,2).forEach(function(n){
        positions.push(a.px, a.py, a.pz, n.b.px, n.b.py, n.b.pz);
      });
    });
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

      transparent: true,

      depthWrite: false

      c.localPos = new THREE.Vector3(c.px, c.py, c.pz);

      var base = cityBase(c.name);

      var coreMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(1, 0.78 + intensity*0.12, 0.6 + intensity*0.1),

      var gs = 30 + intensity * 42;

      var hit = new THREE.Mesh(
        new THREE.SphereGeometry(24, 10, 10),
        new THREE.MeshBasicMaterial({visible:false})
      );
      hit.position.copy(c.localPos);
      hit.userData.city = c;
      cityGroup.add(hit);
      cityHitMeshes.push(hit);

      c.core = core;
      c.glow = glow;
      c.labelNode = labelNode;
      c.intensity = intensity;
      c.scaleTarget = 1;
      c.scaleCurrent = 1;
    });

    var positions = [];
    for (var i = 0; i < n; i++){
      var a = cities[i];
      var b = cities[(i+1) % n];
      positions.push(a.px, a.py, a.pz, b.px, b.py, b.pz);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    var mat = new THREE.LineBasicMaterial({
      color: 0xff9e6e,
      transparent: true,
      opacity: 0.11,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    cityGroup.add(new THREE.LineSegments(geo, mat));
  }

  /* ========== 交互 ========== */
  var raycaster = new THREE.Raycaster();
  var pointer = new THREE.Vector2();
  var dragging = false;
  var dragMoved = 0;
  var lastX = 0, lastY = 0;
  var mouseMode = 'pan';

  /* 点击判定用 */
  var downX = 0, downY = 0, downTime = 0;
  var clickCooldownUntil = 0;

  var targetRotY_p = 0, targetRotX_p = 0;
  var targetRotY_c = 0, targetRotX_c = 0;

  var pinching = false;
  var pinchLock = false;
  var pinchStartDist = 0;
  var pinchStartCamDist = 0;
  var pinchCenterX = 0, pinchCenterY = 0;
  var pinchStartPanX = 0, pinchStartPanY = 0;

  var viewLevel = 'province';

  function getTouchDist(touches){
    var dx = touches[0].clientX - touches[1].clientX;
    var dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }
  function getTouchCenter(touches){
    return {
      x: (touches[0].clientX + touches[1].clientX) / 2,
      y: (touches[0].clientY + touches[1].clientY) / 2
    };
  }

  function onDown(e){
    lastInteractionTime = performance.now();

    if (e.touches && e.touches.length >= 2){
      pinching = true;
      pinchLock = true;
      dragging = false;
      pinchStartDist = getTouchDist(e.touches);
      pinchStartCamDist = targetDistance;
      var c = getTouchCenter(e.touches);
      pinchCenterX = c.x;
      pinchCenterY = c.y;
      pinchStartPanX = targetPanX;
      pinchStartPanY = targetPanY;
      return;
    }

    if (pinching || pinchLock) return;

    if (e.type === 'mousedown'){
      mouseMode = (e.button === 2) ? 'rotate' : 'pan';
    } else {
      mouseMode = 'rotate';
    }

    dragging = true;
    dragMoved = 0;
    var p = e.touches ? e.touches[0] : e;
    lastX = p.clientX;
    lastY = p.clientY;
    downX = p.clientX;
    downY = p.clientY;
    downTime = performance.now();
  }

  function onMove(e){
    if (e.touches && e.touches.length >= 2){
      if (!pinching){
        pinching = true;
        pinchLock = true;
        dragging = false;
        pinchStartDist = getTouchDist(e.touches);
        pinchStartCamDist = targetDistance;
        var c0 = getTouchCenter(e.touches);
        pinchCenterX = c0.x;
        pinchCenterY = c0.y;
        pinchStartPanX = targetPanX;
        pinchStartPanY = targetPanY;
      }

      var d = getTouchDist(e.touches);
      var ratio = pinchStartDist / d;
      targetDistance = Math.max(MIN_DIST, Math.min(MAX_DIST, pinchStartCamDist * ratio));

      var c = getTouchCenter(e.touches);
      var dcx = c.x - pinchCenterX;
      var dcy = c.y - pinchCenterY;
      var wpp = 0.975 * currentDistance / window.innerHeight;
      var limit = baseDistance * 1.5;
      targetPanX = Math.max(-limit, Math.min(limit, pinchStartPanX - dcx * wpp));
      targetPanY = Math.max(-limit, Math.min(limit, pinchStartPanY + dcy * wpp));

      lastInteractionTime = performance.now();
      return;
    }

    if (pinchLock) return;
    if (!dragging) return;

    lastInteractionTime = performance.now();
    var p = e.touches ? e.touches[0] : e;
    var x = p.clientX, y = p.clientY;
    var dx = x - lastX;
    var dy = y - lastY;
    dragMoved += Math.abs(dx) + Math.abs(dy);

    if (mouseMode === 'rotate'){
      if (viewLevel === 'province'){
        targetRotY_p += dx * 0.005;
        targetRotX_p += dy * 0.003;
        targetRotX_p = Math.max(-0.6, Math.min(0.6, targetRotX_p));
      } else {
        targetRotY_c += dx * 0.005;
        targetRotX_c += dy * 0.003;
        targetRotX_c = Math.max(-0.6, Math.min(0.6, targetRotX_c));
      }
      if (dragMoved > 30 && focusState.node){
        clearFocus();
      }
    } else {
      var wpp2 = 0.975 * currentDistance / window.innerHeight;
      targetPanX -= dx * wpp2;
      targetPanY += dy * wpp2;
      var limit2 = baseDistance * 1.5;
      targetPanX = Math.max(-limit2, Math.min(limit2, targetPanX));
      targetPanY = Math.max(-limit2, Math.min(limit2, targetPanY));
      if (dragMoved > 30 && focusState.node){
        clearFocus();
      }
    }

    lastX = x; lastY = y;
  }

  function onUp(e){
    if (pinching){
      if (!e.touches || e.touches.length < 2){
        pinching = false;
        clickCooldownUntil = performance.now() + 300;
      }
      return;
    }

    if (!e.touches || e.touches.length === 0){
      pinchLock = false;
    }
    if (pinchLock) return;
    if (!dragging) return;
    dragging = false;

    var p = (e.changedTouches && e.changedTouches[0]) || e;
    var upX = p.clientX || 0;
    var upY = p.clientY || 0;
    var tdx = upX - downX;
    var tdy = upY - downY;
    var totalDist = Math.sqrt(tdx*tdx + tdy*tdy);
    var duration = performance.now() - downTime;
    var inCooldown = performance.now() < clickCooldownUntil;

    if (totalDist < 15 && duration < 400 && !inCooldown){
      handleClick(e);
    }
  }

  renderer.domElement.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  renderer.domElement.addEventListener('touchstart', onDown, {passive:true});
  window.addEventListener('touchmove', onMove, {passive:true});
  window.addEventListener('touchend', onUp);
  window.addEventListener('touchcancel', onUp);

  renderer.domElement.addEventListener('wheel', function(e){
    e.preventDefault();
    lastInteractionTime = performance.now();
    var factor = e.deltaY > 0 ? 1.1 : 0.9;
    targetDistance = Math.max(MIN_DIST, Math.min(MAX_DIST, targetDistance * factor));
  }, {passive:false});

  renderer.domElement.addEventListener('contextmenu', function(e){
    e.preventDefault();
  });

  function findNearestNode(clickX, clickY, nodes, group, maxDist){
    group.updateMatrixWorld(true);
    var camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    var best = null, bestDist = maxDist;

    nodes.forEach(function(node){
      var v = node.localPos.clone();
      v.applyMatrix4(group.matrixWorld);
      var toNode = v.clone().sub(camera.position);
      if (toNode.dot(camDir) <= 0) return;
      v.project(camera);
      var sx = (v.x * 0.5 + 0.5) * window.innerWidth;
      var sy = (-v.y * 0.5 + 0.5) * window.innerHeight;
      var dx = clickX - sx;
      var dy = clickY - sy;
      var d = Math.sqrt(dx*dx + dy*dy);
      if (d < bestDist){
        bestDist = d;
        best = node;
      }
    });
    return best;
  }

  function handleClick(e){
    var p = (e.changedTouches && e.changedTouches[0]) || e;
    var clickX = p.clientX;
    var clickY = p.clientY;

    pointer.x = (clickX / window.innerWidth) * 2 - 1;
    pointer.y = -(clickY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);

    if (viewLevel === 'province'){
      var hits = raycaster.intersectObjects(provinceHitMeshes);
      if (hits.length > 0){
        enterProvince(hits[0].object.userData.province);
        return;
      }
      var nearest = findNearestNode(clickX, clickY, provinces, provinceGroup, 60);
      if (nearest){
        enterProvince(nearest);
      }
    } else {
      var hits2 = raycaster.intersectObjects(cityHitMeshes);
      if (hits2.length > 0){
        focusOnCity(hits2[0].object.userData.city);
        return;
      }
      var nearest2 = findNearestNode(clickX, clickY, currentProvince.cities, cityGroup, 60);
      if (nearest2){
        focusOnCity(nearest2);
      } else {
        clearFocus();
        closePanel();
      }
    }
  }

  /* ========== 焦点 ========== */
  function focusOnNode(node, group, zoom){
    focusState.node = node;
    focusState.group = group;
    targetDistance = baseDistance * zoom;
  }

  function clearFocus(){
    focusState.node = null;
    focusState.group = null;
    targetDistance = baseDistance;
  }

  /* ========== 视图切换 ========== */
  var hudTop = document.getElementById('hudTop');
  var hudBottom = document.getElementById('hudBottom');
  var backBtn = document.getElementById('backBtn');
  var crumb = document.getElementById('crumb');
  var panel = document.getElementById('panel');
  var panelTitle = document.getElementById('panelTitle');
  var panelTotal = document.getElementById('panelTotal');
  var panelList = document.getElementById('panelList');

  function enterProvince(p){
    if (!p || !p.cities || p.cities.length === 0) return;

    targetPanX = 0;
    targetPanY = 0;

    currentProvince = p;
    viewLevel = 'city';

    buildCityGalaxy(p);
    cityGroup.visible = true;

    provinceGroup.visible = true;
    var t0 = performance.now();
    (function fadeOutProvince(){
      var k = (performance.now() - t0) / 350;
      if (k >= 1){
        provinceGroup.visible = false;
        return;
      }
      provinceGroup.scale.setScalar(1 - k * 0.6);
      requestAnimationFrame(fadeOutProvince);
    })();

    cityGroup.scale.setScalar(0.4);
    var t1 = performance.now();
    (function fadeInCity(){
      var k = (performance.now() - t1) / 550;
      if (k >= 1){
        cityGroup.scale.setScalar(1);
        return;
      }
      var e = 1 - Math.pow(1 - k, 3);
      cityGroup.scale.setScalar(0.4 + e * 0.6);
      requestAnimationFrame(fadeInCity);
    })();

    hudTop.classList.add('hide');
    hudBottom.classList.add('hide');
    backBtn.classList.add('show');
    crumb.textContent = p.name + ' · ' + p.cities.length + ' 个市';
    crumb.classList.add('show');

    focusState.node = null;
    focusState.group = null;
    targetRotY_c = 0;
    targetRotX_c = 0;
    targetDistance = computeBaseDistance() * 0.9;

    closePanel();
  }

  function exitProvince(){
    if (viewLevel === 'province') return;

    viewLevel = 'province';
    currentProvince = null;

    targetPanX = 0;
    targetPanY = 0;

    cityGroup.visible = true;
    var t0 = performance.now();
    (function fadeOutCity(){
      var k = (performance.now() - t0) / 350;
      if (k >= 1){
        cityGroup.visible = false;
        return;
      }
      cityGroup.scale.setScalar(1 - k * 0.6);
      requestAnimationFrame(fadeOutCity);
    })();

    provinceGroup.visible = true;
    provinceGroup.scale.setScalar(0.6);
    var t1 = performance.now();
    (function fadeInProvince(){
      var k = (performance.now() - t1) / 500;
      if (k >= 1){
        provinceGroup.scale.setScalar(1);
        return;
      }
      var e = 1 - Math.pow(1 - k, 3);
      provinceGroup.scale.setScalar(0.6 + e * 0.4);
      requestAnimationFrame(fadeInProvince);
    })();

    hudTop.classList.remove('hide');
    hudBottom.classList.remove('hide');
    backBtn.classList.remove('show');
    crumb.classList.remove('show');

    clearFocus();
    closePanel();
  }

  backBtn.addEventListener('click', exitProvince);

  /* ========== 地级市面板 ========== */
  var selectedCity = null;

  function focusOnCity(c){
    selectedCity = c;
    if (currentProvince && currentProvince.cities){
      currentProvince.cities.forEach(function(q){
        q.scaleTarget = (q === c) ? 1.9 : 1;
      });
    }
    focusOnNode(c, cityGroup, 0.55);

    panelTitle.textContent = c.name;
    panel.classList.add('open');
    renderCityPanel();
  }

  function closePanel(){
    selectedCity = null;
    if (currentProvince && currentProvince.cities){
      currentProvince.cities.forEach(function(q){ q.scaleTarget = 1; });
    }
    panel.classList.remove('open');
  }

  document.getElementById('panelClose').addEventListener('click', function(){
    closePanel();
    clearFocus();
  });

  function renderCityPanel(){
    if (!selectedCity) return;
    var c = selectedCity;
    var rows = c.districts.map(function(d){
      return { name: d, value: valueOf(districtBase(d), c.name + d) };
    });
    var total = rows.reduce(function(s, r){ return s + r.value; }, 0);
    var max = Math.max.apply(null, rows.map(function(r){ return r.value; }));

    panelTotal.innerHTML = '这里，有 <strong>' + formatNum(total) + '</strong> 人和你一起停了一下';

    panelList.innerHTML = rows.map(function(r){
      var pct = max > 0 ? (r.value / max * 100) : 0;
      return '<div class="city-row">'
           +   '<span class="city-name">' + r.name + '</span>'
           +   '<div class="city-bar"><div class="city-bar-fill" style="width:' + pct.toFixed(1) + '%"></div></div>'
           +   '<span class="city-num">' + formatNum(r.value) + '</span>'
           + '</div>';
    }).join('');
  }

  /* ========== 数据 ========== */
  var numEl = document.getElementById('num');
  var topProvEl = document.getElementById('topProv');
  var todayEl = document.getElementById('todayTotal');
  var dailyLineEl = document.getElementById('dailyLine');
  var shareHint = document.getElementById('shareHint');
  var localAdd = 0;

  function getSimulatedCount(){
    var now = new Date();
    var h = now.getHours() + now.getMinutes() / 60;
    var morning = Math.exp(-Math.pow((h - 9) / 3, 2)) * 4000;
    var evening = Math.exp(-Math.pow((h - 21) / 3, 2)) * 6000;
    var wave = Math.sin(now.getTime() / 45000) * 200;
    return Math.max(0, Math.floor(3000 + morning + evening + wave));
  }
  function getTodayTotal(){
    var now = new Date();
    var h = now.getHours() + now.getMinutes() / 60;
    var jitter = Math.sin(now.getTime() / 60000) * 200;
    return Math.max(0, Math.floor(h * 4200 + jitter + 2000));
  }

  function updateNumbers(){
    numEl.textContent = formatNum(getSimulatedCount() + localAdd);
    todayEl.textContent = formatNum(getTodayTotal() + localAdd);
  }

  function updateProvinceIntensities(){
    var now = new Date();
    var h = now.getHours() + now.getMinutes() / 60;
    var top = provinces[0];
    var topVal = -1;

    provinces.forEach(function(p){
      var offset = (p.name.charCodeAt(0) % 12) - 6;
      var lh = (h + offset + 24) % 24;
      var peak = Math.exp(-Math.pow((lh - 21) / 4, 2)) * 0.6
               + Math.exp(-Math.pow((lh - 9) / 4, 2)) * 0.4;
      var wave = Math.sin(now.getTime() / 60000 + p.px) * 0.1;
      var val = p.base / 1500 * (peak + 0.3 + wave);
      if (val > topVal){ topVal = val; top = p; }

      p.core.material.color.setRGB(
        1,
        Math.min(1, 0.72 + val * 0.15),
        Math.min(1, 0.52 + val * 0.14)
      );
      p.core.material.opacity = Math.min(1, 0.8 + val * 0.2);
      p.glow.material.opacity = Math.min(0.95, 0.3 + val * 0.45);

      if (p.labelNode) p.labelNode.draw(provincePeople(p));
    });

    topProvEl.textContent = top.name;
  }

  function updateCityIntensities(){
    if (!currentProvince) return;
    var now = new Date();
    currentProvince.cities.forEach(function(c){
      var wave = Math.sin(now.getTime() / 60000 + c.px) * 0.1;
      var val = c.base / 1300 * (0.6 + wave);
      c.core.material.color.setRGB(
        1,
        Math.min(1, 0.74 + val * 0.14),
        Math.min(1, 0.55 + val * 0.13)
      );
      c.core.material.opacity = Math.min(1, 0.82 + val * 0.18);
      c.glow.material.opacity = Math.min(0.95, 0.32 + val * 0.42);

      if (c.labelNode) c.labelNode.draw(cityPeople(c));
    });
  }

  var DAILY_LINES = [
    '今天不用太用力。',
    '停一下，也算进度。',
    '这周你已经很可以了。',
    '累了就停，不用解释。',
    '不硬撑，也是一种能力。',
    '你在这里，就够了。',
    '慢一点，也没关系。',
    '今天允许自己松一点。'
  ];

  function updateDailyLine(){
    var day = new Date().getDay();
    var hour = new Date().getHours();
    var idx = (day * 7 + Math.floor(hour / 3)) % DAILY_LINES.length;
    dailyLineEl.textContent = DAILY_LINES[idx];
  }

  var hasClicked = false;
  var pauseBtn = document.getElementById('pauseBtn');
  pauseBtn.addEventListener('click', function(){
    if (hasClicked) return;
    hasClicked = true;
    localAdd++;
    updateNumbers();
    numEl.classList.add('pop');
    setTimeout(function(){ numEl.classList.remove('pop'); }, 260);
    pauseBtn.classList.add('done');
    pauseBtn.style.pointerEvents = 'none';
    pauseBtn.textContent = '记住了';

    var rp = provinces[Math.floor(Math.random()*provinces.length)];
    rp.scaleTarget = 2.4;
    setTimeout(function(){ rp.scaleTarget = 1; }, 700);
  });

  /* ========== 尺寸自适应 ========== */
  function onResize(){
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);

    baseDistance = computeBaseDistance();
    if (!focusState.node){
      targetDistance = baseDistance;
    }
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function(){
    setTimeout(onResize, 200);
  });

  /* ========== 动画 ========== */
  var clock = new THREE.Clock();

  function animate(){
    requestAnimationFrame(animate);
    var dt = clock.getDelta();

    panX += (targetPanX - panX) * 0.18;
    panY += (targetPanY - panY) * 0.18;

    var now = performance.now();
    var canAutoRotate = !dragging && !pinching && !focusState.node
                     && (now - lastInteractionTime > 3000);

    if (canAutoRotate){
      if (viewLevel === 'province') targetRotY_p += dt * 0.09;
      else targetRotY_c += dt * 0.09;
    }

    provinceGroup.rotation.y += (targetRotY_p - provinceGroup.rotation.y) * 0.06;
    provinceGroup.rotation.x += (targetRotX_p - provinceGroup.rotation.x) * 0.06;
    cityGroup.rotation.y += (targetRotY_c - cityGroup.rotation.y) * 0.06;
    cityGroup.rotation.x += (targetRotX_c - cityGroup.rotation.x) * 0.06;

    currentDistance += (targetDistance - currentDistance) * 0.1;

    if (focusState.node && focusState.group){
      focusState.group.updateMatrixWorld(true);
      var wp = focusState.node.localPos.clone();
      wp.applyMatrix4(focusState.group.matrixWorld);

      var targetCamPos = new THREE.Vector3(wp.x, wp.y, wp.z + currentDistance);
      camera.position.lerp(targetCamPos, 0.15);
      lookAtPoint.lerp(wp, 0.15);
    } else {
      var restPos = new THREE.Vector3(panX, panY, currentDistance);
      var restLook = new THREE.Vector3(panX, panY, 0);
      camera.position.lerp(restPos, 0.15);
      lookAtPoint.lerp(restLook, 0.15);
    }
    camera.lookAt(lookAtPoint);

    provinces.forEach(function(p){
      p.scaleCurrent += (p.scaleTarget - p.scaleCurrent) * 0.1;
      if (p.core){
        p.core.scale.setScalar(p.scaleCurrent);
        p.glow.scale.setScalar((30 + p.intensity * 42) * (0.6 + p.scaleCurrent * 0.4));
      }
    });

    if (currentProvince && currentProvince.cities){
      currentProvince.cities.forEach(function(c){
        c.scaleCurrent += (c.scaleTarget - c.scaleCurrent) * 0.1;
        if (c.core){
          c.core.scale.setScalar(c.scaleCurrent);
          c.glow.scale.setScalar((30 + c.intensity * 42) * (0.6 + c.scaleCurrent * 0.4));
        }
      });
    }

    renderer.render(scene, camera);
  }
  animate();

  /* ========== 启动 ========== */
  updateNumbers();
  updateProvinceIntensities();
  updateDailyLine();

  setInterval(updateNumbers, 3000);
  setInterval(function(){
    updateProvinceIntensities();
    updateCityIntensities();
    if (selectedCity) renderCityPanel();
  }, 3500);
  setInterval(updateDailyLine, 60000);

  setTimeout(function(){
    shareHint.classList.add('show');
  }, 20000);

  /* 操作提示 */
  var pcHint = document.getElementById('pcHint');
  var touchHint = document.getElementById('touchHint');
  var isFinePointer = window.matchMedia && window.matchMedia('(pointer:fine)').matches;

  if (isFinePointer){
    setTimeout(function(){ pcHint.classList.add('show'); }, 5000);
    setTimeout(function(){ pcHint.classList.remove('show'); }, 17000);
  } else {
    setTimeout(function(){ touchHint.classList.add('show'); }, 5000);
    setTimeout(function(){ touchHint.classList.remove('show'); }, 17000);
  }

})();
</script>
</body>
