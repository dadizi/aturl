<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070a">
<title>累了吗？- leilema.cn</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;background:#08070a;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
    color:#fff;user-select:none;
  }
  body{
    display:flex;flex-direction:column;align-items:center;
    padding:6vh 5vw 4vh;overflow-x:hidden;
  }

  /* 顶部数字 */
  .counter-wrap{text-align:center;margin-bottom:3vh}
  .counter-label{
    font-size:clamp(12px,1.6vmin,14px);
    letter-spacing:.28em;padding-left:.28em;
    color:rgba(255,238,222,.3);font-weight:300;
  }
  .counter-num{
    display:block;margin-top:14px;
    font-size:clamp(42px,11vmin,86px);
    font-weight:200;letter-spacing:.04em;
    color:rgba(255,232,210,.92);
    text-shadow:0 0 40px rgba(255,190,140,.18);
    transition:transform .25s ease;
  }
  .counter-num.pop{transform:scale(1.06)}

  /* 地图 */
  .map-wrap{
    position:relative;width:100%;max-width:700px;
    margin-bottom:3vh;
  }
  svg.map{display:block;width:100%;height:auto}
  .city-dot{
    cursor:pointer;
    transition:opacity .4s ease, r .4s ease;
  }
  .city-dot:hover{opacity:1 !important}

  /* 按钮 */
  .btns{
    display:flex;gap:10px;margin-bottom:3vh;
    width:100%;max-width:560px;justify-content:center;
    flex-wrap:wrap;
  }
  .btn{
    flex:1;min-width:100px;max-width:180px;
    padding:14px 10px;
    border:1px solid rgba(255,225,200,.12);
    border-radius:100px;
    background:rgba(255,200,160,.03);
    color:rgba(255,238,222,.6);
    font-size:clamp(13px,1.7vmin,15px);
    letter-spacing:.14em;padding-left:.14em;
    font-weight:300;cursor:pointer;
    transition:all .35s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover{
    border-color:rgba(255,225,200,.28);
    color:rgba(255,238,222,.85);
    background:rgba(255,200,160,.06);
  }
  .btn:active{transform:scale(.97)}
  .btn.done{
    border-color:rgba(255,204,166,.35);
    color:rgba(255,212,172,.9);
    background:rgba(255,190,140,.08);
    cursor:default;
  }

  /* 底部信息 */
  .stats{
    text-align:center;
    font-size:clamp(11px,1.4vmin,13px);
    letter-spacing:.2em;padding-left:.2em;
    color:rgba(255,238,222,.28);font-weight:300;
    line-height:2;
  }
  .stats .top-city{
    color:rgba(255,210,170,.55);
  }
  .footer{
    margin-top:2.5vh;
    font-size:clamp(10px,1.2vmin,11.5px);
    letter-spacing:.18em;padding-left:.18em;
    color:rgba(255,238,222,.12);font-weight:300;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .counter-num{transition:none}
    .city-dot{transition:none}
    .btn{transition:none}
  }
</style>
</head>
<body>

  <div class="counter-wrap">
    <span class="counter-label">此刻，有</span>
    <span class="counter-num" id="num">12,847</span>
    <span class="counter-label">人和你一样累</span>
  </div>

  <div class="map-wrap">
    <svg class="map" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
      <!-- 简化中国轮廓 -->
      <path d="M 660,100 L 700,120 L 720,180 L 680,220 L 660,260 L 690,280 L 680,320 L 720,340 L 700,380 L 680,420 L 640,460 L 600,500 L 560,530 L 520,540 L 480,520 L 460,480 L 440,440 L 400,460 L 360,440 L 320,400 L 280,380 L 220,360 L 180,320 L 160,280 L 200,240 L 180,200 L 220,160 L 280,140 L 340,160 L 400,140 L 440,160 L 480,140 L 520,120 L 560,100 L 600,80 L 640,90 Z"
            fill="rgba(255,180,130,.025)"
            stroke="rgba(255,180,130,.08)"
            stroke-width="1"/>
      <g id="dots"></g>
    </svg>
  </div>

  <div class="btns">
    <button class="btn" data-level="tired">有点累</button>
    <button class="btn" data-level="very">很累</button>
    <button class="btn" data-level="cant">累到不想说话</button>
  </div>

  <div class="stats">
    此刻最累的城市：<span class="top-city" id="topCity">成都</span><br>
    今天已有 <span id="todayTotal">89,231</span> 人标记过
  </div>

  <div class="footer">截图发给你想到的那个人</div>

<script>
(function(){
  'use strict';

  var numEl     = document.getElementById('num');
  var topCityEl = document.getElementById('topCity');
  var todayEl   = document.getElementById('todayTotal');
  var dotsGroup = document.getElementById('dots');
  var btns      = document.querySelectorAll('.btn');

  /* ========== 城市数据 ========== */
  var cities = [
    { name: '北京',    x: 560, y: 224, base: 1200 },
    { name: '上海',    x: 626, y: 373, base: 1500 },
    { name: '广州',    x: 520, y: 511, base: 1000 },
    { name: '深圳',    x: 530, y: 521, base: 1100 },
    { name: '成都',    x: 401, y: 381, base: 1300 },
    { name: '重庆',    x: 432, y: 400, base: 1000 },
    { name: '杭州',    x: 609, y: 388, base: 900  },
    { name: '武汉',    x: 533, y: 383, base: 850  },
    { name: '西安',    x: 463, y: 320, base: 700  },
    { name: '南京',    x: 591, y: 357, base: 750  },
    { name: '长沙',    x: 516, y: 424, base: 650  },
    { name: '郑州',    x: 524, y: 313, base: 600  },
    { name: '天津',    x: 570, y: 238, base: 550  },
    { name: '苏州',    x: 614, y: 371, base: 600  },
    { name: '青岛',    x: 611, y: 289, base: 450  },
    { name: '大连',    x: 627, y: 241, base: 400  },
    { name: '厦门',    x: 582, y: 487, base: 450  },
    { name: '昆明',    x: 383, y: 479, base: 400  },
    { name: '贵阳',    x: 435, y: 451, base: 350  },
    { name: '哈尔滨',  x: 691, y: 123, base: 400  },
    { name: '沈阳',    x: 650, y: 191, base: 400  },
    { name: '兰州',    x: 397, y: 289, base: 300  },
    { name: '乌鲁木齐',x: 188, y: 157, base: 250  },
    { name: '拉萨',    x: 233, y: 400, base: 150  }
  ];

  /* 生成光点 */
  cities.forEach(function(c){
    var circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', c.x);
    circle.setAttribute('cy', c.y);
    circle.setAttribute('r', 6);
    circle.setAttribute('fill', 'rgba(255,190,140,.6)');
    circle.setAttribute('class', 'city-dot');
    circle.dataset.name = c.name;
    dotsGroup.appendChild(circle);
    c.el = circle;
  });

  /* ========== 模拟实时数字 ========== */
  function getSimulatedCount(){
    var now = new Date();
    var h = now.getHours() + now.getMinutes() / 60;

    var morningPeak = Math.exp(-Math.pow((h - 9) / 3, 2)) * 4000;
    var eveningPeak = Math.exp(-Math.pow((h - 21) / 3, 2)) * 6000;
    var base = 3000;
    var wave = Math.sin(now.getTime() / 45000) * 200;

    return Math.max(0, Math.floor(base + morningPeak + eveningPeak + wave));
  }

  function getTodayTotal(){
    var now = new Date();
    var h = now.getHours() + now.getMinutes() / 60;
    var base = Math.floor(h * 4200);
    var jitter = Math.floor(Math.sin(now.getTime() / 60000) * 200);
    return Math.max(0, base + jitter + 2000);
  }

  function formatNum(n){
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  /* ========== 更新数字 ========== */
  var localAdd = 0;

  function updateNumbers(){
    var count = getSimulatedCount() + localAdd;
    numEl.textContent = formatNum(count);
    todayEl.textContent = formatNum(getTodayTotal() + localAdd);
  }

  /* ========== 更新光点 ========== */
  function updateDots(){
    var now = new Date();
    var h = now.getHours() + now.getMinutes() / 60;

    var maxIntensity = 0;
    var topCity = cities[0].name;

    cities.forEach(function(c){
      var offset = (c.name.charCodeAt(0) % 12) - 6;
      var cityHour = (h + offset + 24) % 24;
      var peak = Math.exp(-Math.pow((cityHour - 21) / 4, 2)) * 0.6 +
                 Math.exp(-Math.pow((cityHour - 9) / 4, 2)) * 0.4;
      var wave = Math.sin(now.getTime() / 60000 + c.x) * 0.1;
      var intensity = Math.max(0.1, c.base / 1500 * (peak + 0.3 + wave));

      if (intensity > maxIntensity){
        maxIntensity = intensity;
        topCity = c.name;
      }

      c.el.setAttribute('r', 3 + intensity * 8);
      c.el.setAttribute('fill', 'rgba(255,190,140,' + Math.min(0.85, 0.25 + intensity * 0.5) + ')');
    });

    topCityEl.textContent = topCity;
  }

  /* ========== 按钮交互 ========== */
  var hasClicked = false;

  btns.forEach(function(btn){
    btn.addEventListener('click', function(){
      if (hasClicked) return;
      hasClicked = true;

      localAdd++;
      updateNumbers();

      numEl.classList.add('pop');
      setTimeout(function(){ numEl.classList.remove('pop'); }, 260);

      btns.forEach(function(b){
        b.classList.add('done');
        b.style.pointerEvents = 'none';
      });
      btn.textContent = '记住了';

      // 让对应光点稍微亮一下
      var randomCity = cities[Math.floor(Math.random() * cities.length)];
      randomCity.el.setAttribute('r', 14);
      randomCity.el.setAttribute('fill', 'rgba(255,220,180,.9)');
      setTimeout(function(){
        randomCity.el.setAttribute('r', 6);
      }, 600);
    });
  });

  /* ========== 启动 ========== */
  updateNumbers();
  updateDots();

  setInterval(updateNumbers, 3000);
  setInterval(updateDots, 10000);

})();
</script>
</body>
</html>
