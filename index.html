<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7BAE9A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="public, max-age=604800">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>累了吗？</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>
  <div class="loader" id="loader">
    <div class="loader-content">
      <span class="loader-icon">🌿</span>
      <span class="loader-text">正在加载...</span>
    </div>
  </div>
  
  <div class="container" id="mainContent" style="display: none;">
    <header>
      <h1>累了吗？</h1>
      <p class="subtitle">嗨，坐下来歇会儿，跟自己聊聊天</p>
    </header>
    
    <div class="buttons-container">
      <a href="quiz.html" class="btn" onclick="handleLinkClick(this)">
        我是哪种累？
      </a>
      <a href="stories.html" class="btn" onclick="handleLinkClick(this)">
        听听别人的故事
      </a>
      <a href="solution.html" class="btn btn-secondary" onclick="handleLinkClick(this)">
        想轻松一点
      </a>
    </div>
    
    <footer>
      慢慢来，你已经很棒了 💛
    </footer>
  </div>

  <div class="error-overlay" id="errorOverlay" style="display: none;">
    <div class="error-content">
      <span class="error-icon">😔</span>
      <p class="error-text">网络有点慢，再试一次吧</p>
      <button class="btn" onclick="reloadPage()">重新加载</button>
    </div>
  </div>

  <style>
    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #FFF9F5 0%, #F0F7F4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    
    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    
    .loader-icon {
      font-size: 2.5rem;
      animation: bounce 1s ease-in-out infinite;
    }
    
    .loader-text {
      font-size: 1rem;
      color: var(--text-light);
    }
    
    .error-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 249, 245, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      padding: 20px;
    }
    
    .error-content {
      text-align: center;
      max-width: 320px;
    }
    
    .error-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }
    
    .error-text {
      font-size: 1.1rem;
      color: var(--text-light);
      margin-bottom: 24px;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>

  <script>
    function handleLinkClick(element) {
      event.preventDefault();
      const url = element.getAttribute('href');
      const loader = document.getElementById('loader');
      loader.style.display = 'flex';
      setTimeout(() => {
        window.location.href = url;
      }, 100);
    }

    function reloadPage() {
      const loader = document.getElementById('loader');
      const errorOverlay = document.getElementById('errorOverlay');
      errorOverlay.style.display = 'none';
      loader.style.display = 'flex';
      window.location.reload();
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const loader = document.getElementById('loader');
        const mainContent = document.getElementById('mainContent');
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
          mainContent.style.display = 'flex';
        }, 300);
      }, 500);
    });

    window.addEventListener('load', () => {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.display = 'none';
        document.getElementById('mainContent').style.display = 'flex';
      }
    });

    window.addEventListener('error', (event) => {
      console.error('加载错误:', event.message);
      document.getElementById('loader').style.display = 'none';
      document.getElementById('errorOverlay').style.display = 'flex';
    });

    window.addEventListener('offline', () => {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('errorOverlay').style.display = 'flex';
    });
  </script>
</body>
</html>
