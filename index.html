<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7BAE9A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="public, max-age=604800">
  <title>累了吗？</title>
  <style>
    :root{--primary-color:#7BAE9A;--secondary-color:#E8F4F0;--warm-bg:#FDF8F3;--text-color:#5A5A5A;--text-light:#999999;--shadow-sm:0 2px 8px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.08);--shadow-lg:0 8px 32px rgba(0,0,0,0.1);--radius:16px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(135deg,#FFF9F5 0%,#F0F7F4 100%);min-height:100vh;color:var(--text-color);line-height:1.6;-webkit-font-smoothing:antialiased}
    .container{max-width:480px;margin:0 auto;padding:40px 20px;display:flex;flex-direction:column;min-height:100vh}
    header{text-align:center;margin-bottom:40px}
    h1{font-size:2.5rem;font-weight:700;background:linear-gradient(135deg,var(--primary-color),#5A8A7A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;letter-spacing:-0.02em}
    .subtitle{font-size:1.1rem;color:var(--text-light);margin-top:8px}
    .buttons-container{display:flex;flex-direction:column;gap:16px;margin:auto 0}
    .btn{display:block;text-align:center;padding:16px 32px;background:var(--primary-color);color:white;text-decoration:none;border-radius:var(--radius);font-weight:600;font-size:1.05rem;transition:all 0.3s ease;box-shadow:var(--shadow-md)}
    .btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
    .btn:active{transform:translateY(0)}
    .btn-secondary{background:var(--secondary-color);color:var(--primary-color)}
    footer{text-align:center;margin-top:auto;padding-top:40px;font-size:0.95rem;color:var(--text-light)}
    @media (max-width:480px){h1{font-size:2rem}.subtitle{font-size:1rem}.btn{padding:14px 24px;font-size:1rem}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>累了吗？</h1>
      <p class="subtitle">嗨，坐下来歇会儿，跟自己聊聊天</p>
    </header>
    
    <div class="buttons-container">
      <a href="quiz.html" class="btn">我是哪种累？</a>
      <a href="stories.html" class="btn">听听别人的故事</a>
      <a href="solution.html" class="btn btn-secondary">想轻松一点</a>
    </div>
    
    <footer>慢慢来，你已经很棒了 💛</footer>
  </div>
</body>
</html>
