<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7BAE9A">
  <meta http-equiv="Cache-Control" content="public, max-age=604800">
  <title>听听他们的故事</title>
  <style>
    :root{--p:#7BAE9A;--s:#E8F4F0;--w:#FDF8F3;--t:#5A5A5A;--l:#999;--r:16px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#FFF9F5,#F0F7F4);min-height:100svh;color:var(--t);line-height:1.6}
    .c{max-width:520px;margin:0 auto;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom, 20px));min-height:100svh;display:flex;flex-direction:column}
    h1{font-size:2rem;background:linear-gradient(135deg,var(--p),#5A8A7A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;text-align:center}
    .su{color:var(--l);text-align:center;margin-bottom:20px}
    .sc{background:white;border-radius:var(--r);padding:20px;box-shadow:0 4px 16px rgba(0,0,0,0.08)}
    .cat{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;background:var(--s);border-radius:20px;width:fit-content}
    .ci{font-size:1.2rem}.cl{font-size:0.85rem;color:var(--t);opacity:0.8}
    .st{font-size:1.1rem;font-weight:600;margin-bottom:12px}
    .stx{font-size:1.05rem;line-height:1.8;color:var(--t);opacity:0.9;background:#F5F5F5;padding:16px;border-radius:12px}
    .btn{display:block;text-align:center;padding:14px 24px;background:var(--p);color:white;border:none;border-radius:var(--r);font-weight:600;font-size:1rem;cursor:pointer;transition:all 0.2s;margin:16px auto 0 auto}
    .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.12)}
    footer{text-align:center;margin-top:auto;padding-top:20px}
    footer a{color:var(--l);text-decoration:none;font-size:0.9rem;margin:0 12px;display:inline-block}
    footer a:hover{color:var(--p)}
    footer p{margin-top:12px;font-size:0.85rem;color:var(--l);opacity:0.5}
    @media(max-width:480px){.c{padding:16px}h1{font-size:1.8rem}.sc{padding:16px}}
  </style>
</head>
<body>
  <div class="c">
    <h1>听听他们的故事</h1>
    <p class="su">你不是一个人</p>
    
    <div class="sc" id="storyCard">
      <div class="cat"><span class="ci" id="icon">🛋️</span><span class="cl" id="type">躯体性疲劳</span></div>
      <div class="st" id="title">连续加班的设计师</div>
      <div class="stx" id="text">小李是一名设计师，连续三个月赶项目，每天对着电脑十几个小时。一开始只是肩膀酸痛，后来开始头痛、视力模糊，早上起床全身僵硬。医生说这是典型的躯体性疲劳，需要规律休息和适度运动。现在小李每天定时站起来拉伸，每周去两次瑜伽课，身体状态好多了。</div>
      <button class="btn" id="nextBtn">再看一个故事</button>
    </div>
    
    <footer>
      <a href="index.html">返回首页</a>
      <a href="quiz.html">测测你的累</a>
      <p>故事里藏着提醒，希望你的故事永远是「还来得及」。</p><p style="margin-top:8px;font-size:0.8rem;opacity:0.5;">© <script>document.write(new Date().getFullYear())</script> leilema.cn</p>
    </footer>
  </div>
  <script>
    const stories = [
      {
        t: '连续加班的设计师',
        x: '小李是一名设计师，连续三个月赶项目，每天对着电脑十几个小时。一开始只是肩膀酸痛，后来开始头痛、视力模糊，早上起床全身僵硬。医生说这是典型的躯体性疲劳，需要规律休息和适度运动。现在小李每天定时站起来拉伸，每周去两次瑜伽课，身体状态好多了。',
        i: '🛋️',
        y: '躯体性疲劳'
      },
      {
        t: '健身教练的提醒',
        x: '小王是健身教练，身体一直很好。最近准备比赛，过度训练导致身体透支。一开始以为只是肌肉酸痛，直到一次训练中眼前一黑差点晕倒。医生检查后说他免疫力下降，需要彻底休息。现在小王明白了，过度运动反而会伤身体，适度才是最好的。',
        i: '🛋️',
        y: '躯体性疲劳'
      },
      {
        t: '信息爆炸的产品经理',
        x: '小张是产品经理，每天要回几百条消息，开十几个会，同时跟进多个项目。慢慢发现自己记性变差，看长文档需要反复读几遍才能理解，做决定时脑子像卡住了一样。后来他开始用番茄工作法，每50分钟休息10分钟，慢慢找回了状态。',
        i: '🧠',
        y: '脑力性疲劳'
      },
      {
        t: '考研失利的学生',
        x: '小陈准备考研，每天学习16个小时，咖啡一杯接一杯。慢慢发现注意力无法集中，刚看过的内容转眼就忘，甚至出现了头晕、恶心的症状。医生说这是大脑过度疲劳的表现。后来小陈调整了作息，每天保证8小时睡眠，学习效率反而提高了。',
        i: '🧠',
        y: '脑力性疲劳'
      },
      {
        t: '戴着面具的销售',
        x: '小林是销售，每天要见很多客户，永远要保持热情和微笑。一开始只是觉得累，后来手机一响就心悸，回家一句话都不想说，甚至害怕社交场合。后来小林开始学习设定边界，不再勉强自己，每周留一天完全不工作，只做自己喜欢的事。',
        i: '👥',
        y: '社会性疲劳'
      },
      {
        t: '终于辞职的HR',
        x: '小周做了5年HR，每天处理各种人际关系，调解矛盾，安慰同事。慢慢发现自己回到家就"瘫痪"，不想说话，甚至不想见人。后来她辞了职，给自己放了半年假，慢慢找回了社交的动力。现在她换了一份不需要太多人际互动的工作，整个人轻松多了。',
        i: '👥',
        y: '社会性疲劳'
      },
      {
        t: '永远在拖延的创业者',
        x: '小吴创业三年，每天都有一堆事要做，但就是坐在办公桌前刷手机，心里充满了自责，却无法开始工作。项目拖了又拖， deadlines 变成了摆设。后来他尝试了五分钟启动法，告诉自己只做五分钟，慢慢打破了拖延的恶性循环。',
        i: '🌙',
        y: '意志力耗竭型疲劳'
      },
      {
        t: '完美主义的学生',
        x: '小郑是完美主义者，每件事都要做到最好，不然就干脆不开始。论文改了十几版还是不满意，工作任务拖到最后一刻才动手。后来他尝试允许自己先完成一个60分的版本，慢慢发现完成比完美更重要，效率反而提高了。',
        i: '🌙',
        y: '意志力耗竭型疲劳'
      },
      {
        t: '在大厂找不到意义的程序员',
        x: '小冯在大厂工作，收入不错，但每天都觉得做的事情没有意义。早上醒来就觉得"又要重复一天"，对以前喜欢的游戏、运动都提不起劲。后来他开始做一些"没用"的事——画画、养花、学乐器，慢慢找到了生活的意义感。',
        i: '🌌',
        y: '存在性疲劳'
      },
      {
        t: '退休后迷茫的医生',
        x: '陈医生退休前是科室主任，每天被病人和手术填满。退休后突然闲下来，觉得生活失去了重心，对什么都没兴趣。后来他开始做义诊，每周去社区医院帮忙，又重新找到了价值感和生活的意义。',
        i: '🌌',
        y: '存在性疲劳'
      },
      {
        t: '重新爱上运动的人',
        x: '小赵以前也很疲惫，后来通过规律作息、适度运动、健康饮食，慢慢找回了状态。现在他每天早起跑步，工作效率提高了，心情也变好了。他说："身体状态好了，整个人生都不一样了。"',
        i: '🌈',
        y: '找回状态的人'
      },
      {
        t: '学会说「不」的她',
        x: '小钱以前是老好人，别人让帮忙从不拒绝，把自己搞得很累。后来她学会了说"不"，只做自己真正想做的事，生活反而变得更充实了。她说："拒绝不是冷漠，是对自己和别人都负责。"',
        i: '🌈',
        y: '找回状态的人'
      }
    ];
    let last=-1;
    function show(){
      let n;
      do{n=Math.floor(Math.random()*stories.length)}while(n===last);
      last=n;
      const s=stories[n];
      document.getElementById('icon').textContent=s.i;
      document.getElementById('type').textContent=s.y;
      document.getElementById('title').textContent=s.t;
      document.getElementById('text').textContent=s.x;
      const c=document.getElementById('storyCard');
      c.style.opacity=0;
      setTimeout(()=>{c.style.opacity=1},50);
    }
    document.getElementById('nextBtn').onclick=show;
    document.querySelectorAll('footer a').forEach(a=>{a.onclick=()=>{window.location.href=a.getAttribute('href')};});
    show();
  </script>
</body>
</html>
